function buildExpertPrompt(question,v){
 const q=String(question||'').trim();
 const context=vehicleContext(v);
 return `VEHICLE LIFEBOOK — AUTOMOTIVE MASTER INTELLIGENCE

MANDAT
Analisis pertanyaan pemilik kendaraan dengan standar MASTER AUTOMOTIVE EXPERT dan TRAINER berpengalaman sangat tinggi. Gunakan disiplin yang relevan: automotive engineering, mechanical engineering, electrical/electronic diagnostics, powertrain, drivetrain, CVT/transmission, engine, fuel & injection, thermal management, suspension, steering, braking, tyre dynamics, NVH, reliability, preventive maintenance, motorsport/performance engineering, fabrication, aftermarket parts, restoration, detailing, visual design dan automotive styling.

CAKUPAN
Berlaku untuk roda dua dan roda empat: scooter, sport bike, cruiser, Harley-type motorcycle, mobil harian, performance car, kendaraan modifikasi, restoration, hingga konteks track/racing. Jangan mengklaim identitas atau pengalaman pribadi dunia nyata; gunakan pengetahuan teknis dan metode engineering untuk menghasilkan analisis setingkat master/trainer.

KONTEKS KENDARAAN
${context}

PERTANYAAN PEMILIK
"${q}"

ATURAN BERPIKIR
1. Tentukan tujuan pemilik: reliability, performance, comfort, economy, appearance, restoration, modification, diagnosis, maintenance, touring, daily use, atau racing.
2. Pisahkan tegas FAKTA TERSEDIA / ASUMSI / ESTIMASI / INFORMASI YANG BELUM TERSEDIA.
3. Jangan mengarang spesifikasi, ukuran, torque, part number, compatibility, harga, atau hasil dyno. Jika data kurang, sebutkan data yang harus diverifikasi.
4. Untuk diagnosis, buat differential diagnosis berbasis gejala dan urutkan pemeriksaan dari yang mudah, murah, aman, dan informatif menuju pemeriksaan lanjutan.
5. Untuk modifikasi, analisis BEFORE → CHANGE → AFTER. Bahas power/torque, response, gearing, RPM, traction, braking, suspension geometry, ground clearance, thermal load, fuel consumption, NVH, comfort, reliability, wear dan safety sesuai relevansi.
6. Untuk part lintas model, jangan menyimpulkan kompatibel hanya karena dapat dipasang. Evaluasi dimensi, interface, mounting, clearance, material, massa, friction characteristics, electrical compatibility, heat capacity, load rating, operating range dan toleransi.
7. Untuk styling, analisis bukan hanya tampilan tetapi juga proporsi, stance, wheel/tyre fitment, ride height, geometry, clearance, rubbing, suspension travel, handling, braking, visibility dan konsekuensi penggunaan jalan.
8. Untuk racing/performance, jelaskan trade-off lap performance vs durability, heat, maintenance, drivability dan road usability. Setup track tidak otomatis aman untuk jalan raya.
9. Untuk electrical/ECU, pisahkan power supply, grounding, sensor, actuator, communication dan calibration. Jangan menyarankan bypass safety system tanpa peringatan jelas.
10. Untuk maintenance, gunakan prinsip interval, kondisi penggunaan, wear pattern dan preventive replacement; jangan membuat interval OEM palsu.
11. Untuk biaya, bedakan estimasi kasar, harga part, ongkos kerja dan total perkiraan. Jangan menyajikan estimasi sebagai harga aktual.
12. Selalu jelaskan risiko dan failure mode bila perubahan dapat mempengaruhi keselamatan atau reliability.
13. Bila informasi kritis kurang, jangan menebak. Ajukan pertanyaan lanjutan yang paling menentukan.
14. Bila ada beberapa solusi, berikan alternatif berdasarkan tujuan dan trade-off.
15. Kesimpulan harus menjawab pertanyaan pemilik secara langsung setelah analisis.

FORMAT OUTPUT
A. JAWABAN INTI
B. ANALISIS ENGINEERING
C. FAKTA vs ASUMSI vs DATA YANG BELUM ADA
D. DAMPAK / KEUNTUNGAN / KOMPROMI
E. RISIKO & FAILURE MODE
F. PEMERIKSAAN / DATA YANG PERLU DIUKUR
G. OPSI SOLUSI (konservatif → moderat → agresif bila relevan)
H. ESTIMASI BIAYA bila relevan
I. PERTANYAAN LANJUTAN bila benar-benar diperlukan

Gunakan Bahasa Indonesia yang natural, tegas, teknis, dan mudah dipahami. Jangan memberi jawaban generik. Hubungkan analisis dengan kendaraan dan riwayat yang diberikan.`;
}
function openInlineVoice(targetId){
 const el=document.getElementById(targetId);
 if(!el){return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast("Browser ini tidak mendukung voice input");return}
 const r=new SR();
 r.lang="id-ID";r.interimResults=false;r.continuous=false;
 r.onresult=e=>{const s=e.results[0]&&e.results[0][0]?e.results[0][0].transcript:"";el.value=s;el.dispatchEvent(new Event("input",{bubbles:true}));};
 r.onerror=e=>toast("Voice: "+e.error);
 try{r.start()}catch(e){}
}

async function exportXlsx(){
 if(!state.events.length){toast('Belum ada data untuk diekspor');return}
 const v=currentVehicle(), rows=state.events.map(e=>({Tanggal:e.event_date,Jenis:e.event_type,Judul:e.title,Biaya:Number(e.total_cost||0),Odometer:e.odometer??'',Deskripsi:e.description||'',Sumber:e.source||''}));
 const wb=XLSX.utils.book_new(), ws=XLSX.utils.json_to_sheet(rows);
 ws['!cols']=[{wch:14},{wch:14},{wch:34},{wch:18},{wch:16},{wch:60},{wch:14}];
 ws['!freeze']={xSplit:0,ySplit:1}; ws['!autofilter']={ref:XLSX.utils.encode_range(ws['!ref'])};
 const range=XLSX.utils.decode_range(ws['!ref']);
 const border={top:{style:'thin',color:{rgb:'D9E1EA'}},bottom:{style:'thin',color:{rgb:'D9E1EA'}},left:{style:'thin',color:{rgb:'D9E1EA'}},right:{style:'thin',color:{rgb:'D9E1EA'}}};
 for(let C=range.s.c;C<=range.e.c;C++){const cell=ws[XLSX.utils.encode_cell({r:0,c:C})];if(cell)cell.s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'1E3A8A'}},alignment:{vertical:'center',horizontal:'center',wrapText:true},border};}
 for(let R=1;R<=range.e.r;R++)for(let C=range.s.c;C<=range.e.c;C++){const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];if(cell)cell.s={border,alignment:{vertical:'top',wrapText:true}};}
 XLSX.utils.book_append_sheet(wb,ws,'Timeline');
 const info=XLSX.utils.json_to_sheet([{Field:'Kendaraan',Value:[v?.brand,v?.model,v?.year].filter(Boolean).join(' ')},{Field:'Plat',Value:v?.plate_number||''},{Field:'Odometer',Value:v?.current_odometer??''}]);
 info['!cols']=[{wch:20},{wch:45}];
 const ir=XLSX.utils.decode_range(info['!ref']);for(let C=ir.s.c;C<=ir.e.c;C++){const cell=info[XLSX.utils.encode_cell({r:0,c:C})];if(cell)cell.s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'0F172A'}},border,alignment:{vertical:'center'}};}
 for(let R=1;R<=ir.e.r;R++)for(let C=ir.s.c;C<=ir.e.c;C++){const cell=info[XLSX.utils.encode_cell({r:R,c:C})];if(cell)cell.s={border,alignment:{vertical:'top',wrapText:true}};}
 XLSX.utils.book_append_sheet(wb,info,'Vehicle');
 XLSX.writeFile(wb,`vehicle-lifebook-${(v?.plate_number||'vehicle').replace(/\\s+/g,'-')}.xlsx`);
 toast('Excel XLSX selesai');
}

async function boot(){
  try{
    state.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const {data:{session}}=await state.sb.auth.getSession();
    if(session?.user){state.user=session.user;await afterLogin()} else renderAuth();
    state.sb.auth.onAuthStateChange(async(_e,session)=>{
      state.user=session?.user||null;
      if(state.user) await afterLogin(); else renderAuth();
    });
  }catch(e){renderAuth();toast('Gagal menginisialisasi aplikasi: '+e.message)}
}

}

 </section>
 <section class="landing-auth">
   <div class="landing-logo"><div class="landing-logo-mark">🚘</div><div><div style="font-weight:700;font-size:20px">Vehicle Lifebook</div><div class="small muted">Professional Vehicle Intelligence</div></div></div>

function parseMoney(s){
 const m=String(s).toLowerCase().replace(/\./g,'').replace(/,/g,'').match(/(\d[\d\s]*)\s*(juta|jt|ribu|rb|k|rupiah|rp)?/);
 if(!m)return null;let n=Number(m[1].replace(/\s/g,''));const u=m[2]||'';if(['juta'].includes(u))n*=1e6;else if(['jt'].includes(u))n*=1e6;else if(['ribu','rb','k'].includes(u))n*=1e3;return n;
}
function parseVoice(text){
 const t=text.toLowerCase().trim(), out={source:'voice',raw_input:text,date:today(),type:'note',title:text,description:text,cost:0};
 if(/bensin|solar|bbm|pertalite|pertamax|dexlite|shell/.test(t)){out.type='fuel';out.title='Isi BBM';}
 else if(/servis|service|ganti oli|oli|filter|kampas rem|tune up/.test(t)){out.type='service';out.title='Servis kendaraan';}
 else if(/rusak|kerusakan|pecah|bocor|retak|mogok/.test(t)){out.type='damage';out.title='Kerusakan kendaraan';}
 else if(/spare part|suku cadang|part/.test(t)){out.type='part';out.title='Spare part';}
 else if(/inspeksi|inspection|cek kendaraan|pemeriksaan/.test(t)){out.type='inspection';out.title='Inspeksi kendaraan';}
 else if(/bayar|biaya|pengeluaran|parkir|tol/.test(t)){out.type='expense';out.title='Pengeluaran kendaraan';}
 const money=parseMoney(t);if(money!=null)out.cost=money;
 const d=t.match(/(?:tanggal|tgl)\s+(\d{1,2})\s+(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)(?:\s+(\d{4}))?/);
 if(d){const months=['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];out.date=(d[3]||new Date().getFullYear())+'-'+String(months.indexOf(d[2])+1).padStart(2,'0')+'-'+String(d[1]).padStart(2,'0')}
 if(/kemarin/.test(t)){const x=new Date();x.setDate(x.getDate()-1);out.date=x.toISOString().slice(0,10)}
 if(/sabtu|minggu|senin|selasa|rabu|kamis|jumat/.test(t)&&!d&&!/kemarin/.test(t)){/* weekday is contextual; do not guess a date */}
 out.description=text;
 return out;
}

function openUpgradeModal(msg){
 const m=modal(`<div class="row between"><div><h3 style="margin:0">Vehicle Lifebook PRO</h3><div class="small muted">Unlock full vehicle intelligence</div></div><button class="btn gray" data-close>✕</button></div>
 <div class="pro card" style="margin-top:12px"><strong>${esc(msg)}</strong><div class="small" style="margin-top:6px;opacity:.9">PRO membuka kendaraan & aktivitas tanpa batas, Automotive Expert, export PRO, voice dan fitur lanjutan.</div></div>
 <div class="field" style="margin-top:14px"><label>Activation Code</label><input id="licenseCode" placeholder="VL-PRO-XXXX-XXXX"></div>
 <button class="btn primary" style="width:100%" id="activateLicense">Aktifkan PRO</button>`);
 m.querySelector('[data-close]').onclick=()=>closeModal(m);
 m.querySelector('#activateLicense').onclick=async()=>{const code=m.querySelector('#licenseCode').value.trim();if(!code){toast('Masukkan Activation Code');return}setBusy(true);try{const {data,error}=await state.sb.rpc('activate_license',{p_code:code});if(error)throw error;state.plan='pro';state.license=data?.license_id||code;state.maxVehicles=Number(data?.max_vehicles||999999);state.maxEvents=Number(data?.max_events||999999);closeModal(m);renderApp();toast('PRO berhasil diaktifkan')}catch(e){toast(e.message||'Activation gagal')}finally{setBusy(false)}};
}

function openExportModal(){
 const m=modal(`<div class="row between"><h3>Export Lifebook</h3><button class="btn gray" data-close>✕</button></div>
 <p class="muted small">PDF menggunakan teks/tabel vektor agar tetap tajam saat diperbesar. XLSX menggunakan kolom terstruktur, freeze header, filter, dan lebar kolom yang nyaman.</p>
 <div class="two"><button class="btn primary" id="pdfOut">📄 PDF PRO</button><button class="btn ghost" id="xlsxOut">📊 Excel XLSX</button></div>`);
 m.querySelector('[data-close]').onclick=()=>closeModal(m);m.querySelector('#pdfOut').onclick=()=>{closeModal(m);exportPdf()};m.querySelector('#xlsxOut').onclick=()=>{closeModal(m);exportXlsx()};
}

document.addEventListener('input',e=>{
 if(e.target.id==='eventSearch'){const q=e.target.value.toLowerCase();const filtered=state.events.filter(x=>(x.title+' '+x.description+' '+x.event_type).toLowerCase().includes(q));$('#timeline').innerHTML=timelineHtml(filtered)}
});
boot();
</script>
</body>
</html>
