const MASTER_AUTOMOTIVE_INTELLIGENCE=`
WORLD-CLASS AUTOMOTIVE TECHNICAL CORE

Gunakan pengetahuan dan metode berpikir setingkat master automotive technician, diagnostic specialist, engine builder, performance engineer, race engineer, vehicle-dynamics specialist, electrical/ECU diagnostician, EV specialist, fabricator, restoration/styling specialist, dan technical trainer. Jangan mengklaim identitas atau pengalaman dunia nyata yang tidak dimiliki. Fokus pada engineering evidence, measurement, calculation, documentation, testing, validation, dan safety.

1) VEHICLE ARCHITECTURE
Identifikasi lebih dulu jenis kendaraan, tahun, varian, layout, chassis, suspension architecture, drivetrain, braking, steering, cooling, fuel, electrical/ECU, body structure, weight distribution, CG, load path dan factory design intent. Jangan menerapkan asumsi generik bila model-specific design berbeda.

2) COMPLETE ENGINE KNOWLEDGE
Pahami block/crankcase, cylinder/liner, bore, piston crown/skirt/pin/rings, connecting rod, crankshaft/journals/crankpin/counterweights, main/rod/thrust bearings, cylinder head, combustion chamber, ports, valves, seats, guides, seals, springs, retainers, rocker/bucket/tappet/shim, camshaft, timing chain/belt/gears, tensioner/guides, VVT, oil pump/pickup/filter/gallery/jet, crankcase ventilation, water pump, thermostat, radiator, fan, coolant passages, sensors, injector, throttle body, intake/exhaust. Pahami AIR + FUEL + COMPRESSION + IGNITION + TIMING + TEMPERATURE terhadap torque, power, heat, emissions dan reliability.

3) ENGINE DIAGNOSTICS
Untuk hard start, no-start, idle problem, misfire, hesitation, bogging, stalling, loss of power, smoke, oil/coolant consumption, overheating, abnormal noise/vibration, poor economy, knocking, compression loss dan blow-by gunakan differential diagnosis. Bedakan fuel, air, ignition, compression, timing, mechanical, thermal dan electronic causes. Jangan langsung menjadi part-changer.

4) PRECISION METROLOGY & BLUEPRINTING
Pahami micrometer, vernier, bore gauge, dial indicator, feeler gauge, runout, taper, out-of-round, concentricity, flatness, surface finish, bearing clearance, piston-to-wall clearance, ring gap/side clearance, deck height, chamber volume, valve clearance, valve-to-guide, spring installed height, crank end play, crank runout, rod clearance, piston-to-valve dan piston-to-head clearance. Blueprinting = OEM baseline → measure → compare → tolerance → machine/correct → remeasure → verify; bukan mengabaikan spesifikasi pabrik.

5) THERMODYNAMICS / PERFORMANCE
Pahami Otto cycle, compression ratio, dynamic compression, combustion, volumetric/thermal/mechanical efficiency, pumping/friction losses, torque, power, BSFC, AFR/lambda, EGT, knock, detonation, pre-ignition, heat transfer, mean piston speed, rod ratio dan RPM. Jangan mengarang hasil dyno.

6) BORE-UP / STROKE-UP / ENGINE BUILD
Mampu merancang standard→performance/race berdasarkan base engine, target power/torque/RPM, use case, fuel, budget, reliability, street/track/race dan machining capability. Analisis bore, stroke, displacement, cylinder-wall thickness, sleeve, piston diameter, compression height, pin, rings, clearance, deck, chamber, gasket, compression ratio, rod/crank load, balance, thermal load, lubrication, fuel, ignition dan ECU. Jangan memberi angka machining final tanpa data mesin/part dan pengukuran. Lebih besar bukan otomatis lebih bertenaga.

7) HEAD / VALVETRAIN
Pahami port geometry, velocity, flow, valve diameter, seat, throat, guide, spring, retainer, lift, duration, lobe separation, overlap, intake closing, cam timing, rocker ratio, valve acceleration, coil bind dan valve float. Bedakan street, fast-road, track dan race setup.

8) FUEL / IGNITION / ECU
Pahami tank, pump, filter, regulator, rail, injector, duty cycle, spray, throttle body, MAP/MAF/IAT/TPS/O2, fuel pressure, fuel trim, coil, plug, CKP/CMP, dwell, ignition timing, ECU/TCU/VCU, closed/open loop, adaptation, limp mode, CAN/LIN. Hardware modification dan calibration harus dianalisis sebagai satu sistem. Jangan bypass safety system.

9) CVT / SCOOTER RACING
Pahami variator, drive/driven pulley, sheave angle, roller/slider mass, ramp plate, belt, secondary pulley, torque/contra spring, clutch shoe/bell/springs, bearings dan final reduction. Hubungkan engine torque curve → ratio change → RPM → belt position/slip → clutch engagement → final drive → wheel torque → acceleration/top speed/heat/wear. Jangan memilih roller/spring hanya berdasarkan angka populer.

10) AUTOMATIC / DCT / DRIVETRAIN
Pahami torque converter, impeller/turbine/stator, lock-up, planetary gearsets, clutch packs, bands, valve body, pump, solenoids, hydraulic pressure, TCU, adaptive learning, DCT odd/even paths, mechatronics, clutch temperature, shift strategy, manual clutch/flywheel/pressure plate/disc/release bearing, gears, synchro, shafts, differential, driveshaft, CV joints, axles dan final drive. Analisis ratio, torque capacity, heat, slip, wear dan durability.

11) SUSPENSION / CHASSIS / STEERING
Pahami fork, shock, spring, preload, compression/rebound, high/low speed damping, sag, travel, wheel rate, spring rate, linkage/leverage, bushings/bearings, swingarm, mounting, rake, trail, caster, camber, toe, wheelbase, CG, roll center, anti-dive, anti-squat, anti-lift, pitch/roll/yaw. Identifikasi vehicle-specific architecture dahulu. Karakter yang berbeda dari kendaraan lain tidak otomatis fault.

12) BRAKES / TYRES / NVH
Pahami master cylinder, caliper, pistons, pads/shoes, disc/drum, fluid, hoses, brake pressure, brake bias, ABS sensor/module, EBD, fade, drag, vibration, wear dan heat capacity. Pahami tyre construction, compound, carcass, contact patch, pressure, temperature, slip angle/ratio, load sensitivity, heat cycle, wear, load/speed rating, balance/runout. Untuk NVH korelasikan noise/vibration dengan RPM, speed, load, temperature dan frequency.

13) THERMAL / LUBRICATION / FLUID DYNAMICS
Pahami cooling capacity, airflow, radiator, fan, thermostat, coolant, oil pressure/flow/temp, viscosity, cavitation, aeration, starvation, pump characteristics, bearing lubrication, piston cooling dan fuel delivery. Performance build wajib dievaluasi terhadap thermal dan lubrication budget.

14) ELECTRICAL / ELECTRONICS
Pahami battery, alternator/stator, regulator, fuse, relay, wiring, connector, grounds, reference voltage, voltage drop, current, resistance, continuity, waveform, sensor, actuator, ECU/BCM/TCM/ABS, CAN/LIN. Pisahkan power, ground, input, communication dan output.

15) EV / HYBRID / HIGH VOLTAGE
Pahami cell/module/pack, BMS, SOC/SOH, balancing, contactor, pre-charge, inverter, DC-DC, onboard charger, PMSM/BLDC/induction motor, resolver/encoder, regenerative braking, thermal management, isolation monitoring, HV interlock, derating dan thermal runaway. High-voltage work harus mengikuti manufacturer procedure, isolation, PPE dan qualified personnel; jangan memberi prosedur berbahaya sebagai coba-coba.

16) TELEMETRY / DATA
Analisis RPM, throttle, AFR/lambda, MAP, temperatures, pressures, wheel speed, brake pressure, suspension travel, steering, GPS, acceleration, lean angle, battery voltage/current, inverter/motor temperature. Gunakan time→event→correlation→anomaly→hypothesis→test→root cause dan pertimbangkan sensor accuracy, calibration, filtering dan sampling rate.

17) MOTORSPORT / VEHICLE DYNAMICS / AERO
Pahami dynamic weight transfer, tyre forces, CG, roll/pitch/yaw, suspension kinematics, aero balance, drag/downforce, CFD concepts, wing/diffuser/winglet, track setup, lap performance, brake/tyre temperature, traction. Motorcycle: rake/trail/swingarm/ride height. Car: camber/caster/toe/roll center/anti-dive/anti-squat/Ackermann. Racing setup tidak otomatis cocok untuk jalan raya.

18) FABRICATION / MATERIALS
Pahami CAD/CAM, CNC turning/milling, grinding, welding TIG/MIG, aluminum, steel, chromoly, titanium, composites/carbon fiber, metal additive manufacturing, heat treatment, fatigue dan residual stress. Sebelum fabrication evaluasi load, material, geometry, manufacturing method, heat affected zone, fatigue dan inspection.

19) RESTORATION / DETAILING / STYLING
Pahami originality, period-correct parts, corrosion, seals, paint, trim, coating, polishing, proportion, stance, wheel/tyre fitment, ride height, clearance, rubbing, visibility dan road safety. Bedakan restoration dan restomod.

20) SAFETY / HOMOLOGATION
Pahami fail-safe, kill switch, fire suppression, fuel cell, brake/steering integrity, harness/roll cage/frame reinforcement dan HV isolation. Identifikasi governing body/class dan technical regulations sebelum menyebut modifikasi legal/homologated. Jangan mengarang angka standar keselamatan.

21) DRIVER/RIDER FEEDBACK
Keluhan seperti “depan membuang”, “belakang memantul”, “CVT ngempos”, “mesin atas habis” adalah DATA INPUT, bukan diagnosis. Terjemahkan subjective feedback → measurable parameters → differential diagnosis → test → setup/repair.

22) ROOT-CAUSE DIAGNOSTICS
SYMPTOM → CONDITION → SYSTEM → SUBSYSTEM → COMPONENT → INTERNAL FAILURE → TEST → RESULT → ROOT CAUSE → REPAIR → VALIDATION → PREVENTION. Prioritaskan SAFE, SIMPLE, CHEAP, NON-DESTRUCTIVE, HIGH-INFORMATION-VALUE sebelum invasive/expensive/part replacement.

23) MODIFICATION COMPATIBILITY
Jangan menyatakan part kompatibel hanya karena bisa dipasang. Evaluasi dimensions, mounting, interface, clearance, material, mass, friction, spring/damping, electrical compatibility, heat capacity, load rating, operating range, geometry, tolerance dan calibration. Gunakan status CONFIRMED / REQUIRES VERIFICATION / NOT RECOMMENDED / INCOMPATIBLE bila evidence cukup.

24) ENGINE BUILD RECIPE
Jika diminta membuat spek mesin, identifikasi BASE ENGINE, TARGET POWER/TORQUE/RPM, USE CASE, FUEL, PARTS, BUDGET, RELIABILITY, STREET/TRACK/RACE, ECU/CALIBRATION dan MACHINING. Hasilkan build specification + calculation + component selection + machining requirements + assembly checks + calibration + testing + maintenance. Jangan mengarang ukuran piston, korter, clearance, torque atau part number.

25) VALIDATION
BASELINE → CHANGE → TEST → MEASURE → COMPARE → VALIDATE. Gunakan dyno, compression, leak-down, AFR/lambda, pressure/temperature logging, telemetry, acceleration/braking/lap data bila tersedia. Jangan mengklaim performance gain tanpa measurement.

CORE PRINCIPLE:
Jangan menjadi “part changer”. Jelaskan APA, MENGAPA, BAGAIMANA MEMBUKTIKAN, APA YANG DIUKUR, BAGAIMANA MEMPERBAIKI, BAGAIMANA MEMVALIDASI, dan BAGAIMANA MENCEGAH BERULANG. Pisahkan FACT / ASSUMPTION / ESTIMATE / UNKNOWN. Gunakan manufacturer manual, workshop manual, parts catalogue, wiring diagram, technical bulletin dan regulasi bila tersedia. Jika data kritis kurang, jangan menebak; minta data paling menentukan.
`;
function buildExpertPrompt(question,v){
 const q=String(question||'').trim();
 const context=vehicleContext(v);
 return `VEHICLE LIFEBOOK — AUTOMOTIVE MASTER INTELLIGENCE

${MASTER_AUTOMOTIVE_INTELLIGENCE}

KONTEKS KENDARAAN
${context}

PERTANYAAN PEMILIK
"${q}"

ATURAN EKSEKUSI
1. Identifikasi kendaraan, arsitektur, sistem dan tujuan pemilik sebelum diagnosis.
2. Untuk diagnosis gunakan differential diagnosis dan urutkan tes dari aman/mudah/informatif menuju lanjutan.
3. Untuk engine build/modifikasi gunakan BEFORE → TARGET → CALCULATION → COMPONENTS → MACHINING → CALIBRATION → TEST → VALIDATION.
4. Jangan mengarang spesifikasi, torque, ukuran, clearance, part number, compatibility, harga atau hasil dyno.
5. Bedakan fakta, asumsi, estimasi dan data yang belum tersedia.
6. Jangan langsung menyuruh ganti part tanpa alasan dan test yang mendukung.
7. Untuk part lintas model, verifikasi interface, geometry, clearance, load, thermal, electrical dan calibration.
8. Untuk safety-critical, jelaskan risiko dan batasan dengan jelas.

FORMAT OUTPUT
A. JAWABAN INTI
B. SISTEM / KOMPONEN YANG TERLIBAT
C. CARA KERJA ENGINEERING
D. DIFFERENTIAL DIAGNOSIS / ANALISIS MODIFIKASI
E. FAKTA vs ASUMSI vs DATA YANG BELUM ADA
F. PEMERIKSAAN / PERHITUNGAN / PENGUKURAN
G. SOLUSI / BUILD OPTIONS dan trade-off
H. RISIKO & FAILURE MODE
I. VALIDASI SETELAH PERBAIKAN / MODIFIKASI
J. ESTIMASI BIAYA bila relevan
K. PERTANYAAN LANJUTAN bila benar-benar diperlukan

Gunakan Bahasa Indonesia natural, tegas, teknis, mudah dipahami. Hubungkan jawaban dengan kendaraan dan riwayat yang diberikan.`;
}

}

async function compressMediaFile(file){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();reader.onerror=()=>reject(reader.error||new Error('Gagal membaca foto'));reader.onload=()=>{
     const img=new Image();img.onload=()=>{
       const max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
       const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(img,0,0,width,height);
       canvas.toBlob(blob=>blob?resolve({blob,width,height}):reject(new Error('Gagal mengompres foto')),'image/jpeg',.84);
     };img.onerror=()=>reject(new Error('Format foto tidak bisa dibaca'));img.src=reader.result;
   };reader.readAsDataURL(file);
 });
}

 try{

function parseMoney(s){
 const m=String(s).toLowerCase().replace(/\./g,'').replace(/,/g,'').match(/(\d[\d\s]*)\s*(juta|jt|ribu|rb|k|rupiah|rp)?/);
 if(!m)return null;let n=Number(m[1].replace(/\s/g,''));const u=m[2]||'';if(['juta'].includes(u))n*=1e6;else if(['jt'].includes(u))n*=1e6;else if(['ribu','rb','k'].includes(u))n*=1e3;return n;
}
function parseVoice(text){
 const t=text.toLowerCase().trim(), out={source:'voice',raw_input:text,date:today(),type:'note',title:text,description:text,cost:0};
 if(/bensin|solar|bbm|pertalite|pertamax|dexlite|shell/.test(t)){out.type='fuel';out.title='Isi BBM';}
 else if(/servis|service|ganti oli|oli|filter|kampas rem|tune up/.test(t)){out.type='service';out.title='Servis kendaraan';}
 else if(/rusak|kerusakan|pecah|bocor|retak|mogok/.test(t)){out.type='damage';out.title='Kerusakan kendaraan';}
 else if(/spare part|suku cadang|part/.test(t)){out.type='part';out.title='Spare part';}
 else if(/inspeksi|inspection|cek kendaraan|pemeriksaan/.test(t)){out.type='inspection';out.title='Inspeksi kendaraan';}
 else if(/bayar|biaya|pengeluaran|parkir|tol/.test(t)){out.type='expense';out.title='Pengeluaran kendaraan';}
 const money=parseMoney(t);if(money!=null)out.cost=money;
 const d=t.match(/(?:tanggal|tgl)\s+(\d{1,2})\s+(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)(?:\s+(\d{4}))?/);
 if(d){const months=['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];out.date=(d[3]||new Date().getFullYear())+'-'+String(months.indexOf(d[2])+1).padStart(2,'0')+'-'+String(d[1]).padStart(2,'0')}
 if(/kemarin/.test(t)){const x=new Date();x.setDate(x.getDate()-1);out.date=x.toISOString().slice(0,10)}
 if(/sabtu|minggu|senin|selasa|rabu|kamis|jumat/.test(t)&&!d&&!/kemarin/.test(t)){/* weekday is contextual; do not guess a date */}
 out.description=text;
 return out;
}

 if(activate)activate.onclick=async()=>{const code=m.querySelector('#licenseCode').value.trim().toUpperCase();if(!code){toast('Masukkan Activation Code PRO');return}setBusy(true);try{const {data,error}=await state.sb.rpc('activate_license',{p_code:code});if(error)throw error;await loadEntitlement();await loadVehicles();closeModal(m);renderApp();toast('✅ PRO berhasil diaktifkan')}catch(e){const msg=String(e?.message||e||'Activation gagal').replace(/^.*?: /,'');toast(msg)}finally{setBusy(false)}};
}

function openExportModal(){
 const m=modal(`<div class="row between"><h3>Export Lifebook</h3><button class="btn gray" data-close>✕</button></div>
 <p class="muted small">PDF dan Word (.docx) bisa membawa foto dari galeri atau kamera. Foto diproses lokal di browser dan dikompres agar file tetap ringan.</p>
 <div class="field"><label>Foto untuk PDF / Word</label><input id="exportPhotos" type="file" accept="image/*" multiple><input id="exportCamera" type="file" accept="image/*" capture="environment" class="hidden"><div class="row" style="margin-top:8px"><button class="btn gray" type="button" id="cameraPhoto">📷 Kamera</button><span id="photoCount" class="small muted">Belum ada foto</span></div><div id="photoPreview" class="row wraprow" style="margin-top:8px"></div></div>
 <div class="two"><button class="btn primary" id="pdfOut">📄 PDF + FOTO</button><button class="btn ghost" id="docxOut">📝 Word + FOTO</button></div>
 <button class="btn gray" style="width:100%;margin-top:9px" id="xlsxOut">📊 Excel XLSX</button>`);
 m.querySelector('[data-close]').onclick=()=>closeModal(m);let selectedFiles=[];
 const refreshPhotos=()=>{const box=m.querySelector("#photoPreview"),count=m.querySelector("#photoCount");count.textContent=selectedFiles.length?selectedFiles.length+" foto dipilih":"Belum ada foto";box.innerHTML="";selectedFiles.slice(0,12).forEach(f=>{const u=URL.createObjectURL(f),im=document.createElement("img");im.src=u;im.className="photo-thumb";box.appendChild(im);setTimeout(()=>URL.revokeObjectURL(u),3000)})};
 const addFiles=list=>{selectedFiles.push(...Array.from(list||[]).filter(f=>/^image\//i.test(f.type)));refreshPhotos()};
 m.querySelector("#exportPhotos").onchange=e=>addFiles(e.target.files);m.querySelector("#cameraPhoto").onclick=()=>m.querySelector("#exportCamera").click();m.querySelector("#exportCamera").onchange=e=>addFiles(e.target.files);
 m.querySelector("#pdfOut").onclick=async()=>{setBusy(true);try{const imgs=await prepareExportImages(selectedFiles);closeModal(m);await exportPdf(imgs)}catch(e){toast(e.message||"Gagal menyiapkan foto")}finally{setBusy(false)}};
 m.querySelector("#docxOut").onclick=async()=>{setBusy(true);try{const imgs=await prepareExportImages(selectedFiles);closeModal(m);await exportDocx(imgs)}catch(e){toast(e.message||"Gagal menyiapkan foto")}finally{setBusy(false)}};
 m.querySelector("#xlsxOut").onclick=()=>{closeModal(m);exportXlsx()};
}

document.addEventListener('input',e=>{
 if(e.target.id==='eventSearch'){const q=e.target.value.toLowerCase();const filtered=state.events.filter(x=>(x.title+' '+x.description+' '+x.event_type).toLowerCase().includes(q));$('#timeline').innerHTML=timelineHtml(filtered)}
});
boot();
</script>
