name: Vehicle Lifebook QA
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: read
jobs:
  pages-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate onboarding lifecycle hooks
        run: node scripts/validate-onboarding.mjs
      - name: Smoke test deployed GitHub Pages
        run: node scripts/smoke-pages.mjs
